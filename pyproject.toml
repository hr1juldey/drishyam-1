[project]
name = "t5g2-decision"
version = "0.1.0"
description = "Decoupled T5Gemma-2-270M System-1 decision engine (Gate 1: text-only proof, CUDA)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.56,<6",
    "datasets>=3.0",
    "peft>=0.14",
    "accelerate>=1.0",
    "huggingface-hub>=0.30",
    "hf-transfer>=0.1.8",
    "pydantic>=2.7",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "numpy>=2.0",
    "tqdm>=4.66",
    "mlflow>=3.0",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t5g2_decision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
