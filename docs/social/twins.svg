<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300"><rect width="100%" height="100%" fill="#fafafa"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Twin documents: identical, except one field is missing</text><rect x="60" y="70" width="300" height="120" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="210.0" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Document A</text><text x="210.0" y="118" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">electricity bill, complete:</text><text x="210.0" y="136" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">name, meter no., units, amount,</text><text x="210.0" y="154" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">due date &#8212; all printed</text><rect x="440" y="70" width="300" height="120" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/><text x="590.0" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Document B (its twin)</text><text x="590.0" y="118" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">same bill, same layout,</text><text x="590.0" y="136" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">same fonts &#8212; but the amount</text><text x="590.0" y="154" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">was never printed at all</text><line x1="360" y1="130" x2="440" y2="130" stroke="one field removed" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="230" text-anchor="middle" font-size="14" fill="#555" font-family="Helvetica, Arial, sans-serif">The question the twins ask: does the model NOTICE the absence &#8212;</text><text x="400" y="252" text-anchor="middle" font-size="14" fill="#555" font-family="Helvetica, Arial, sans-serif">or does it confidently answer a field that was never there?</text><text x="400" y="278" text-anchor="middle" font-size="13" fill="#777" font-family="Helvetica, Arial, sans-serif">600 registered twin pairs across 5 document families; omission spots chosen where each template allows it</text></svg>