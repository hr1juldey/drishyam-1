<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><rect width="100%" height="100%" fill="#fafafa"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><text x="460" y="52" text-anchor="middle" font-size="19" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">A paper, written from the record: coin-flip to 95.89%</text><rect x="50" y="100" width="260" height="130" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/><text x="180.0" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Failure mode 1</text><text x="180.0" y="158" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">reads real receipts,</text><text x="180.0" y="180" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">cannot judge them:</text><text x="180.0" y="202" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">only 1 in 5 false claims</text><text x="180.0" y="224" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">rejected.</text><rect x="330" y="100" width="260" height="130" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="460.0" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Failure mode 2</text><text x="460.0" y="158" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">forcing balance made it</text><text x="460.0" y="180" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">say no to everything:</text><text x="460.0" y="202" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">prior flipped,</text><text x="460.0" y="224" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">signal never moved.</text><rect x="610" y="100" width="260" height="130" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="740.0" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Failure mode 3</text><text x="740.0" y="158" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">synthetic typography</text><text x="740.0" y="180" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">blinded it to real scans:</text><text x="740.0" y="202" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">the domain gap that</text><text x="740.0" y="224" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">adaptation had to close.</text><line x1="310" y1="165" x2="330" y2="165" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><line x1="590" y1="165" x2="610" y2="165" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><rect x="180" y="280" width="560" height="120" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="460.0" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">And the method, which is the actual contribution</text><text x="460.0" y="338" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">every number dated and signed with its commit;</text><text x="460.0" y="360" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">the falsification published; the adaptation contract</text><text x="460.0" y="382" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">pre-registered; the coin flip published first.</text><text x="460.0" y="404" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">The result is reproducible because the failures are.</text><text x="460" y="440" text-anchor="middle" font-size="13.5" fill="#555" font-family="Helvetica, Arial, sans-serif">draft v0 committed to the repo the same night, built entirely from the ledger.</text></svg>