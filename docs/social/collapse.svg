<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><rect width="100%" height="100%" fill="#fafafa"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><text x="460" y="52" text-anchor="middle" font-size="19" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">The falsification: balance broke the reader, not the bias</text><text x="250" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Before balancing</text><text x="670" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">After balancing (v4)</text><text x="120" y="150" font-size="13" fill="#444" font-family="Helvetica, Arial, sans-serif">Accept TRUE claims</text><rect x="120" y="158" width="300" height="26" rx="6" fill="#2e7d32"/><text x="434" y="176.0" font-size="15" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">98.3%</text><text x="540" y="150" font-size="13" fill="#444" font-family="Helvetica, Arial, sans-serif">Accept TRUE claims</text><rect x="540" y="158" width="8" height="26" rx="6" fill="#2e7d32"/><text x="562" y="176.0" font-size="15" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">0.28%</text><text x="120" y="220" font-size="13" fill="#444" font-family="Helvetica, Arial, sans-serif">Reject FALSE claims</text><rect x="120" y="228" width="62" height="26" rx="6" fill="#2e7d32"/><text x="196" y="246.0" font-size="15" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">20.1%</text><text x="540" y="220" font-size="13" fill="#444" font-family="Helvetica, Arial, sans-serif">Reject FALSE claims</text><rect x="540" y="228" width="303" height="26" rx="6" fill="#2e7d32"/><text x="857" y="246.0" font-size="15" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">99.7%</text><text x="460" y="310" text-anchor="middle" font-size="13.5" fill="#555" font-family="Helvetica, Arial, sans-serif">Both columns, same exam, same receipts. The fix taught it one word: no.</text><text x="460" y="334" text-anchor="middle" font-size="13.5" fill="#555" font-family="Helvetica, Arial, sans-serif">Overall accuracy 49.9% — indistinguishable from the coin flip it started at.</text><rect x="230" y="370" width="460" height="90" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="460.0" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">What was falsified</text><text x="460.0" y="428" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">the theory that the model’s failure was an</text><text x="460.0" y="450" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">answer-distribution problem. Rebalancing flipped</text><text x="460.0" y="472" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">the prior; the underlying signal never moved.</text></svg>