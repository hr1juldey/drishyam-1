<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><rect width="100%" height="100%" fill="#fafafa"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><text x="460" y="52" text-anchor="middle" font-size="19" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">One day, one lever, three meters — Nov 27</text><text x="210" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Correct answers</text><text x="210" y="152" text-anchor="middle" font-size="12" fill="#666" font-family="Helvetica, Arial, sans-serif">out of 100</text><text x="86.0" y="196" text-anchor="middle" font-size="13" fill="#999" font-family="Helvetica, Arial, sans-serif">before</text><text x="425.5" y="196" text-anchor="middle" font-size="13" fill="#222" font-family="Helvetica, Arial, sans-serif">after</text><rect x="110.0" y="170" width="200" height="30" rx="5" fill="#b0bec5"/><rect x="210" y="216" width="383" height="30" rx="5" fill="#2e7d32"/><text x="218" y="236" font-size="14" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">95.9</text><text x="18" y="190" font-size="13" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">51.3</text><text x="460" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Separation</text><text x="460" y="152" text-anchor="middle" font-size="12" fill="#666" font-family="Helvetica, Arial, sans-serif">0 = coin, 1 = perfect</text><text x="336.0" y="196" text-anchor="middle" font-size="13" fill="#999" font-family="Helvetica, Arial, sans-serif">before</text><text x="675.5" y="196" text-anchor="middle" font-size="13" fill="#222" font-family="Helvetica, Arial, sans-serif">after</text><rect x="360.0" y="170" width="200" height="30" rx="5" fill="#b0bec5"/><rect x="460" y="216" width="383" height="30" rx="5" fill="#1565c0"/><text x="468" y="236" font-size="14" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">0.99</text><text x="268" y="190" font-size="13" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">0.52</text><text x="710" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Confidence honesty</text><text x="710" y="152" text-anchor="middle" font-size="12" fill="#666" font-family="Helvetica, Arial, sans-serif">lower is better</text><text x="586.0" y="196" text-anchor="middle" font-size="13" fill="#999" font-family="Helvetica, Arial, sans-serif">before</text><text x="925.5" y="196" text-anchor="middle" font-size="13" fill="#222" font-family="Helvetica, Arial, sans-serif">after</text><rect x="610.0" y="170" width="200" height="30" rx="5" fill="#b0bec5"/><rect x="710" y="216" width="383" height="30" rx="5" fill="#6a1b9a"/><text x="718" y="236" font-size="14" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">0.02</text><text x="518" y="190" font-size="13" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">0.25</text><rect x="110" y="300" width="700" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="460.0" y="332" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Per-field, on real receipts never touched in training</text><text x="460.0" y="358" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">amount correct 95.3% &#183; date 93.2% &#183; company name 99.2%</text><text x="460.0" y="380" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">accepting TRUE claims: 94.2–99.5% &#183; rejecting FALSE claims: 92.2–98.9%</text><text x="460.0" y="402" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">and every internal home-turf bar from before the adaptation: still passing.</text><text x="460" y="446" text-anchor="middle" font-size="13.5" fill="#555" font-family="Helvetica, Arial, sans-serif">Same 361 public receipts, same 2166 questions, same rules as the coin-flip exam.</text><text x="460" y="470" text-anchor="middle" font-size="13.5" fill="#555" font-family="Helvetica, Arial, sans-serif">The only change: what it practiced on, under the contract from the previous episode.</text></svg>