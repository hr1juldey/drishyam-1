<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><rect width="100%" height="100%" fill="#fafafa"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><text x="460" y="52" text-anchor="middle" font-size="19" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">The last lever: teach the model real paper, under contract</text><rect x="50" y="110" width="250" height="140" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="175.0" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Step 1: real data</text><text x="175.0" y="168" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">625 real scanned receipts</text><text x="175.0" y="190" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">from a public dataset,</text><text x="175.0" y="212" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">hand-checked for overlap</text><text x="175.0" y="234" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">with the official test pool.</text><rect x="340" y="110" width="250" height="140" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="465.0" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Step 2: parity proof</text><text x="465.0" y="168" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">each receipt re-rendered</text><text x="465.0" y="190" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">through my synthetic pipeline</text><text x="465.0" y="212" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">and verified to match</text><text x="465.0" y="234" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">its real layout, per template.</text><rect x="630" y="110" width="240" height="140" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="750.0" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Step 3: mix, by recipe</text><text x="750.0" y="168" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">3150 real + 600 synthetic</text><text x="750.0" y="190" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">rows, exact 50/50 answer</text><text x="750.0" y="212" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">balance, fixed seeds.</text><text x="750.0" y="234" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">Training mix frozen first.</text><line x1="300" y1="180" x2="340" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><line x1="590" y1="180" x2="630" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><rect x="180" y="300" width="560" height="100" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="460.0" y="332" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Step 4: the contract, written before the run</text><text x="460.0" y="358" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">the model may gain the real world only if it keeps</text><text x="460.0" y="380" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">its home turf: every internal bar from the previous</text><text x="460.0" y="402" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">verdict must still pass. No exceptions, no re-negotiation.</text><line x1="460" y1="250" x2="460" y2="300" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><text x="460" y="440" text-anchor="middle" font-size="13.5" fill="#555" font-family="Helvetica, Arial, sans-serif">This is domain adaptation with a pre-registered acceptance test.</text></svg>