<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240"><rect width="100%" height="100%" fill="#fafafa"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">The teacher scored below random. So I audited the exam.</text><rect x="30" y="70" width="180" height="85" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/><text x="120.0" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">The suspicion</text><text x="120.0" y="118" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">the big answering model</text><text x="120.0" y="136" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">writes labels for training.</text><text x="120.0" y="154" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">Its scores looked terrible.</text><rect x="240" y="70" width="180" height="85" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="330.0" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Audit round 1</text><text x="330.0" y="118" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">found the answer key was</text><text x="330.0" y="136" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">translating its answers wrong</text><text x="330.0" y="154" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">-</text><text x="330.0" y="172" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">rank names vs rank numbers</text><rect x="450" y="70" width="180" height="85" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="540.0" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Audit round 2</text><text x="540.0" y="118" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">a referee re-read 60 answers</text><text x="540.0" y="136" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">by hand, one by one,</text><text x="540.0" y="154" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">and graded the grader.</text><rect x="660" y="70" width="120" height="85" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="720.0" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Verdict</text><text x="720.0" y="118" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">the teacher was fine.</text><text x="720.0" y="136" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">the exam was not.</text><line x1="210" y1="112" x2="240" y2="112" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><line x1="420" y1="112" x2="450" y2="112" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><line x1="630" y1="112" x2="660" y2="112" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="195" text-anchor="middle" font-size="14" fill="#555" font-family="Helvetica, Arial, sans-serif">agreement error: 1.220 &#8594; 0.223 &#8594; 0.139 after fixing how the exam asked</text><text x="400" y="218" text-anchor="middle" font-size="13" fill="#555" font-family="Helvetica, Arial, sans-serif">final audit: 500/500 answers valid, 13 waves, zero failures</text></svg>