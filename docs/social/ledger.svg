<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><rect width="100%" height="100%" fill="#fafafa"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><text x="460" y="52" text-anchor="middle" font-size="19" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">First contact with three public exams — Nov 26</text><rect x="70" y="100" width="360" height="120" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="250.0" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">What I score on</text><text x="250.0" y="158" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">three independent public benchmarks:</text><text x="250.0" y="180" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">conversational docs, phone photos,</text><text x="250.0" y="202" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">and real scanned receipts.</text><rect x="490" y="100" width="360" height="120" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="670.0" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">The contamination rule</text><text x="670.0" y="158" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">zero of my trained families appear in</text><text x="670.0" y="180" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">what I score; the pinned data snapshot</text><text x="670.0" y="202" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">was proven test-clean before scoring.</text><line x1="430" y1="160" x2="490" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><text x="110" y="272" font-size="13" fill="#444" font-family="Helvetica, Arial, sans-serif">JevBench public-231 (text)</text><rect x="110" y="282" width="240" height="26" rx="6" fill="#2e7d32"/><text x="364" y="300.0" font-size="15" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">39.8%</text><text x="110" y="342" font-size="13" fill="#444" font-family="Helvetica, Arial, sans-serif">ImajeyBench v2-lite (photos)</text><rect x="110" y="352" width="205" height="26" rx="6" fill="#2e7d32"/><text x="329" y="370.0" font-size="15" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">34.1%</text><text x="110" y="412" font-size="13" fill="#444" font-family="Helvetica, Arial, sans-serif">SROIE receipts, real scans</text><rect x="110" y="422" width="310" height="26" rx="6" fill="#2e7d32"/><text x="434" y="440.0" font-size="15" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">51.2%</text><rect x="560" y="370" width="290" height="96" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="705.0" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">The SROIE finding</text><text x="705.0" y="428" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">it READS real receipts fine</text><text x="705.0" y="450" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">(98.3% of dates found)</text><text x="705.0" y="472" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">but rejects only 20.1% of</text><text x="705.0" y="494" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">false claims. Coin-flip overall.</text><text x="460" y="478" text-anchor="middle" font-size="13.5" fill="#555" font-family="Helvetica, Arial, sans-serif">All three numbers published into the benchmark ledger, dated and signed with commit hashes.</text></svg>